<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — CPZ Digital</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/cpz-logo.png">
<style>
  :root{
    --bg:#020408;--accent:#00aaff;--accent2:#00e5ff;
    --text:#e2e8f0;--muted:#7a9ab8;--border:#0d1e30;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2rem;
  }
  .code{
    font-size:5rem;font-weight:800;line-height:1;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1{font-size:1.4rem;font-weight:600;margin:1rem 0 .5rem;}
  p{color:var(--muted);font-size:.95rem;max-width:400px;margin-bottom:2rem;}
  .actions{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;}
  a{
    color:#000;background:linear-gradient(135deg,var(--accent),var(--accent2));
    text-decoration:none;font-weight:600;font-size:.9rem;
    padding:.75rem 1.5rem;border-radius:8px;
  }
  a.secondary{background:none;color:var(--text);border:1px solid var(--border);}
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>Essa página não existe</h1>
  <p>O link que você seguiu não leva a lugar nenhum aqui. Volta pra home ou fala com a gente.</p>
  <div class="actions">
    <a href="/">Voltar pra home</a>
    <a class="secondary" href="mailto:contato@cpzdigital.com.br">Falar conosco</a>
  </div>
</body>
</html>
