<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020408">
<title>Cartão de visita — CPZ Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#020408;--accent:#00aaff;--accent2:color-mix(in srgb,var(--accent) 55%,#fff);--text:#eef5fc;--muted:#7a94ac;--line:rgba(255,255,255,.09);--field:#0a1420;--font:'Inter',system-ui,sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;min-height:100vh;display:flex;justify-content:center;overflow-x:hidden;}
.page{width:100%;max-width:440px;padding-bottom:2rem;animation:in .5s ease both;}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{position:relative;padding:3.5rem 1.5rem 2.2rem;text-align:center;border-bottom:1px solid var(--line);
  background:radial-gradient(ellipse 120% 80% at 50% 0%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 65%),linear-gradient(180deg,#050d18,var(--bg) 95%);}
.avatar{width:112px;height:112px;border-radius:50%;margin:0 auto 1.1rem;object-fit:cover;border:3px solid var(--accent);box-shadow:0 0 38px color-mix(in srgb,var(--accent) 45%,transparent);display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:900;background:var(--field);color:var(--accent2);}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;}
.role{color:var(--accent2);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:.3rem;}
.logo{max-height:38px;max-width:150px;margin:1rem auto 0;display:block;object-fit:contain;}
.bio{margin-top:1rem;color:var(--muted);font-size:.9rem;white-space:pre-line;}
.body{padding:1.5rem 1.5rem 0;}
.row{width:100%;display:flex;align-items:center;gap:1rem;padding:.9rem 0;text-decoration:none;color:var(--text);background:none;border:0;border-bottom:1px solid var(--line);font:inherit;text-align:left;cursor:pointer;}
.row:active{opacity:.6;}
.ico{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid var(--line);}
.ico svg{width:18px;height:18px;stroke:var(--accent2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.primary .ico{background:linear-gradient(150deg,var(--accent),var(--accent2));border:0;}
.primary .ico svg{stroke:#020408;}
.txt{flex:1;min-width:0;}
.t{font-size:.95rem;font-weight:700;display:block;}
.s{font-size:.78rem;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
details{margin-top:1rem;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);}
summary{padding:.95rem 1rem;font-weight:700;font-size:.92rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;}
summary::after{content:'+';color:var(--accent2);}details[open] summary::after{content:'–';}
summary::-webkit-details-marker{display:none;}
.in{padding:0 1rem 1.1rem;text-align:center;}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
.qr{background:#fff;padding:8px;border-radius:12px;display:inline-block;}.qr img,.qr canvas{display:block;max-width:100%;height:auto!important;}
.cap{font-size:.72rem;color:var(--muted);margin-top:.4rem;}
input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:.7rem .85rem;color:var(--text);font:inherit;font-size:.9rem;margin-top:.55rem;}
input:focus{outline:none;border-color:var(--accent);}
.btn{margin-top:.8rem;width:100%;padding:.8rem;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#020408;font-weight:800;font-size:.9rem;cursor:pointer;font-family:var(--font);}
.mono{font-family:Consolas,monospace;font-size:.72rem;color:var(--muted);word-break:break-all;margin-top:.7rem;}
.msg{font-size:.82rem;margin-top:.6rem;color:var(--accent2);}
footer{text-align:center;padding:2rem 1.5rem 0;font-size:.74rem;color:var(--muted);}
footer a{color:var(--accent2);text-decoration:none;font-weight:700;}
.loading{padding:5rem 1.5rem;text-align:center;color:var(--muted);}
</style>
</head>
<body>
<div class="page" id="page"><div class="loading">Carregando…</div></div>
<script>
const sb=window.supabase.createClient('https://wooepdcczasmxpzlofqt.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indvb2VwZGNjemFzbXhwemxvZnF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNzA0NTMsImV4cCI6MjA5Nzc0NjQ1M30.JY1nR9sBS7ejKVbvsMWCYg37r1fKoyKXE3LZyQqbkYA');
const qs=new URLSearchParams(location.search);
const SLUG=(qs.get('s')||[...qs.keys()][0]||'').toLowerCase();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{u=String(u||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;return /^https?:\/\/[^\s"'<>]+$/i.test(u)?u:'';};
const digits=s=>String(s||'').replace(/\D/g,'');
const IC={
 save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
 phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/>',
 wa:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/>',
 mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/>',
 link:'<path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1-1"/>',
 share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
 insta:'<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>'
};
function row(tag,attrs,ic,t,s,cls=''){return `<${tag} class="row ${cls}" ${attrs}><span class="ico"><svg viewBox="0 0 24 24">${IC[ic]||IC.link}</svg></span><span class="txt"><span class="t">${esc(t)}</span>${s?`<span class="s">${esc(s)}</span>`:''}</span></${tag}>`;}
const A=u=>`href="${esc(u)}" target="_blank" rel="noopener"`;

// Pix copia-e-cola (EMV) com valor opcional
const crc16=s=>{let c=0xFFFF;for(const ch of s){c^=ch.charCodeAt(0)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF;}return c.toString(16).toUpperCase().padStart(4,'0');};
const emv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
const noAcc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase();
function pixPayload(key,name,city,amount){
  let p=emv('00','01')+emv('26',emv('00','br.gov.bcb.pix')+emv('01',key))+emv('52','0000')+emv('53','986')+(amount>0?emv('54',amount.toFixed(2)):'')+emv('58','BR')+emv('59',noAcc(name).slice(0,25)||'CPZ')+emv('60',noAcc(city||'RIO DE JANEIRO').slice(0,15))+emv('62',emv('05','***'))+'6304';
  return p+crc16(p);
}
const vEsc=s=>String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
function vcard(d,withPhoto,compact){
  const parts=d.nome.trim().split(/\s+/),last=parts.length>1?parts.pop():'';
  const L=['BEGIN:VCARD','VERSION:3.0'];if(!compact)L.push(`N:${vEsc(last)};${vEsc(parts.join(' '))};;;`);L.push(`FN:${vEsc(d.nome)}`);
  if(d.empresa)L.push('ORG:'+vEsc(d.empresa));if(d.cargo&&!compact)L.push('TITLE:'+vEsc(d.cargo));
  if(d.whatsapp)L.push('TEL;TYPE=CELL:+'+digits(d.whatsapp));if(d.telefone&&!compact)L.push('TEL;TYPE=WORK:'+vEsc(d.telefone));
  if(d.email)L.push('EMAIL:'+vEsc(d.email));
  const site=safeUrl(d.site);if(site&&!compact)L.push('URL:'+site);
  if(!compact)L.push('URL:'+pageUrl());
  const m=/^data:image\/jpeg;base64,(.+)$/.exec(d.avatar||'');
  if(withPhoto&&m)L.push('PHOTO;ENCODING=b;TYPE=JPEG:'+m[1]);
  L.push('END:VCARD');
  return L.join('\r\n').replace(/(.{75})(?=.)/g,'$1\r\n ').replace(/\r\n \r\n/g,'\r\n');
}
const fmtKey=k=>/^\d{14}$/.test(k)?k.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):/^\d{11}$/.test(k)?k.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):k;
const pageUrl=()=>location.origin+location.pathname+'?s='+SLUG;

async function render(){
  const {data:d,error}=await sb.rpc('get_card',{p_slug:SLUG});
  if(error||!d){$('page').innerHTML='<div class="loading">Cartão não encontrado.</div>';return;}
  document.title=d.nome+(d.empresa?' · '+d.empresa:'');
  if(/^#[0-9a-f]{6}$/i.test(d.accent))document.documentElement.style.setProperty('--accent',d.accent);
  const initials=d.nome.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const img=u=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u||'')?u:'';
  const wa=digits(d.whatsapp),site=safeUrl(d.site);
  const ig=d.instagram?safeUrl(/^https?:|\./.test(d.instagram)?d.instagram:'instagram.com/'+d.instagram.replace(/^@/,'')):'';
  let rows=row('a','id="vcfBtn" href="#"','save','Salvar contato na agenda','Nome, telefone, e-mail e foto','primary');
  const tel=d.telefone||wa;
  if(tel)rows+=row('a',`href="tel:${/^\+?[\d\s()-]+$/.test(tel)?esc(tel.replace(/[^\d+]/g,'')):'+'+wa}"`,'phone','Ligar',wa&&!d.telefone?'+'+wa:tel);
  if(wa)rows+=row('a',A('https://wa.me/'+wa),'wa','WhatsApp','Chamar agora');
  if(d.email)rows+=row('a',`href="mailto:${esc(d.email)}"`,'mail','E-mail',d.email);
  if(site)rows+=row('a',A(site),'link','Site',site.replace(/^https?:\/\//,''));
  if(ig)rows+=row('a',A(ig),'insta','Instagram',ig.replace(/^https?:\/\/(www\.)?/,''));
  (d.links||[]).forEach(l=>{const u=safeUrl(l.url);if(u)rows+=row('a',A(u),'link',l.label||u,u.replace(/^https?:\/\//,''));});
  rows+=row('button','id="shareBtn" type="button"','share','Compartilhar este cartão','Enviar para alguém');

  $('page').innerHTML=`
  <div class="hero">
    ${img(d.avatar)?`<img class="avatar" src="${img(d.avatar)}" alt="">`:`<div class="avatar">${esc(initials)}</div>`}
    <h1>${esc(d.nome)}</h1>
    ${d.cargo?`<p class="role">${esc(d.cargo)}</p>`:''}
    ${img(d.logo)?`<img class="logo" src="${img(d.logo)}" alt="${esc(d.empresa)}">`:''}
    ${d.bio?`<p class="bio">${esc(d.bio)}</p>`:''}
  </div>
  <div class="body">
    ${rows}
    <details><summary>QR Code</summary><div class="in"><div class="qrs">
      <div><div class="qr" id="qrOn"></div><div class="cap">Online<br>abre este cartão</div></div>
      <div><div class="qr" id="qrOff"></div><div class="cap">Offline<br>salva o contato</div></div>
    </div></div></details>
    ${d.pix_key?`<details><summary>Pix</summary><div class="in">
      <div class="qr" id="pixQr" style="margin-top:.4rem"></div>
      <div class="cap">Escaneie para pagar · valor em aberto<br>Chave: ${esc(fmtKey(d.pix_key))}</div>
      <div class="mono" id="pixCode"></div>
      <button class="btn" id="pixCopy" type="button">Copiar código Pix</button>
      <input id="pixVal" inputmode="decimal" placeholder="Quer cobrar um valor? Digite aqui" style="margin-top:1.2rem">
      <button class="btn" id="pixGo" type="button" style="background:transparent;border:1px solid var(--line);color:var(--accent2)">Gerar com este valor</button>
    </div></details>`:''}
    ${d.wifi_ssid?`<details><summary>Wi-Fi</summary><div class="in">
      <div class="qr" id="wifiQr" style="margin-top:.4rem"></div><div class="cap">Aponte a câmera para conectar</div>
      <div class="mono">Rede: ${esc(d.wifi_ssid)}${d.wifi_pass?'<br>Senha: '+esc(d.wifi_pass):''}</div>
      ${d.wifi_pass?'<button class="btn" id="wifiCopy" type="button">Copiar senha</button>':''}
    </div></details>`:''}
    <details><summary>Trocar contato com ${esc(d.nome.split(' ')[0])}</summary><div class="in">
      <form id="xForm"><input id="xNome" placeholder="Seu nome (e empresa)" required maxlength="100">
      <input id="xEmail" type="email" placeholder="E-mail" maxlength="120"><input id="xTel" type="tel" placeholder="Celular com DDD" maxlength="30">
      <button class="btn" type="submit">Enviar meu contato</button><div class="msg" id="xMsg"></div></form>
    </div></details>
    <footer>Desenvolvido por <a href="https://cpzdigital.com.br" target="_blank" rel="noopener">CPZ Digital</a></footer>
  </div>`;

  const qr=(el,text,size=140)=>new QRCode($(el),{text,width:size,height:size,colorDark:'#020408',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.L});
  try{qr('qrOn',pageUrl());qr('qrOff',vcard(d,false,true));}catch(err){console.error('QR',err);}
  $('vcfBtn').onclick=async e=>{
    e.preventDefault();
    const txt=vcard(d,true),fname=(noAcc(d.nome).trim().replace(/ +/g,'_')||'contato')+'.vcf';
    const file=new File([txt],fname,{type:'text/vcard'});
    // celular: folha de compartilhar com o arquivo -> "Contatos" importa direto
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:d.nome});return;}catch(err){if(err.name==='AbortError')return;}
    }
    // iPhone sem share de arquivo: data URI abre a tela "Adicionar contato"
    if(/iP(hone|ad|od)/.test(navigator.userAgent)){location.href='data:text/vcard;charset=utf-8,'+encodeURIComponent(txt);return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=fname;document.body.appendChild(a);a.click();a.remove();
  };
  $('shareBtn').onclick=()=>navigator.share?navigator.share({title:d.nome,text:d.nome+(d.cargo?' · '+d.cargo:''),url:pageUrl()}).catch(()=>{}):window.open('https://wa.me/?text='+encodeURIComponent(d.nome+' '+pageUrl()),'_blank');
  const copy=(btn,txt,label)=>{navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Copiado!';setTimeout(()=>btn.textContent=label,1500);});};
  if(d.pix_key){
    let code='';
    const gen=v=>{code=pixPayload(d.pix_key,d.nome,d.pix_city,v);$('pixQr').innerHTML='';qr('pixQr',code,180);$('pixCode').textContent=code;
      document.querySelector('#pixQr+.cap').firstChild.textContent=v>0?'Valor: R$ '+v.toFixed(2).replace('.',',')+' · escaneie para pagar':'Escaneie para pagar · valor em aberto';};
    gen(0);
    $('pixGo').onclick=()=>gen(parseFloat(($('pixVal').value||'0').replace(/\./g,'').replace(',','.'))||0);
    $('pixCopy').onclick=e=>copy(e.target,code,'Copiar código Pix');
  }
  if(d.wifi_ssid){
    const w=s=>String(s).replace(/([\\;,:"])/g,'\\$1');
    qr('wifiQr',`WIFI:T:${d.wifi_pass?'WPA':'nopass'};S:${w(d.wifi_ssid)};P:${w(d.wifi_pass||'')};;`,170);
    if(d.wifi_pass)$('wifiCopy').onclick=e=>copy(e.target,d.wifi_pass,'Copiar senha');
  }
  $('xForm').onsubmit=async e=>{
    e.preventDefault();const m=$('xMsg');m.textContent='Enviando…';
    const {error}=await sb.rpc('add_contact',{p_slug:SLUG,p_nome:$('xNome').value,p_email:$('xEmail').value,p_tel:$('xTel').value});
    m.textContent=error?'Não foi possível enviar. Tente de novo.':'Contato enviado! Obrigado.';
    if(!error)e.target.reset();
  };
}
render();
</script>
</body>
</html>
